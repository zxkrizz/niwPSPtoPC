name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify tagged commit belongs to origin/master
        shell: bash
        run: |
          git fetch --no-tags origin master
          TAG_COMMIT=$(git rev-parse "${GITHUB_REF}^{commit}")
          git merge-base --is-ancestor "$TAG_COMMIT" origin/master
      - name: Match tag to source version
        run: |
          SOURCE_VERSION=$(python -c "import sys; sys.path.insert(0, 'pc-server'); from pc_server import __version__; print(__version__)")
          test "$GITHUB_REF_NAME" = "v$SOURCE_VERSION"
      - name: Run Python and host C tests
        run: |
          cd pc-server
          python -m compileall -q pc_server
          python -m unittest discover -s tests -v
          cd ..
          sh ./scripts/test-c-protocol.sh

  psp:
    name: Build PSP package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build with pinned PSPDEV
        run: |
          PSPDEV_IMAGE=$(cat scripts/pspdev-image.txt)
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$PSPDEV_IMAGE" \
            bash ./scripts/build-psp.sh
      - name: Stage PSP artifact
        run: |
          mkdir -p dist/niwPSPtoPC
          cp psp-client/EBOOT.PBP psp-client/config.ini dist/niwPSPtoPC/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-psp
          path: dist/niwPSPtoPC
          if-no-files-found: error

  windows:
    name: Build Windows package
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build standalone Windows application
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python (Get-Command python).Source
      - name: Smoke-test and verify package
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "./dist/windows/niwPSPtoPC.exe" `
            -ArgumentList "--smoke-test" `
            -WindowStyle Hidden `
            -PassThru `
            -Wait
          if ($process.ExitCode -ne 0) {
            throw "GUI smoke test failed with exit code $($process.ExitCode)"
          }
          ./scripts/verify-windows-package.ps1
      - name: Attest Windows executable
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/windows/niwPSPtoPC.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: dist/windows/niwPSPtoPC.exe
          if-no-files-found: error

  publish:
    name: Package and publish GitHub Release
    needs: [psp, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows
          path: dist/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-psp
          path: psp-client
      - name: Package verified archives
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          ./scripts/package-release.ps1 -Version $version -SkipBuild
      - name: Attest release ZIP archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*.zip
      - name: Publish tag release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $notes = "./docs/releases/$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Missing release notes: $notes"
          }
          $assets = Get-ChildItem ./dist/release -File |
            ForEach-Object { $_.FullName }
          if (gh release view $env:GITHUB_REF_NAME *> $null) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
            gh release edit $env:GITHUB_REF_NAME `
              --title "niwPSPtoPC $env:GITHUB_REF_NAME" `
              --notes-file $notes
          } else {
            gh release create $env:GITHUB_REF_NAME @assets `
              --verify-tag `
              --notes-file $notes `
              --title "niwPSPtoPC $env:GITHUB_REF_NAME"
          }
